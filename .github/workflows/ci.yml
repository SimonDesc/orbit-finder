name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx oxlint src
      - run: npm run build

  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orbit-finder:ci .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 orbit-finder:ci
          for i in $(seq 1 30); do
            curl -fsS localhost:8000/api/health && break
            sleep 1
          done
          curl -fsS localhost:8000/api/apps > /dev/null
          curl -fsS localhost:8000/ | grep -q '<div id="root">'
          test "$(docker inspect -f '{{.State.Health.Status}}' app)" != unhealthy
